---
galaxy_info:
  role_name: swarm_node
  namespace: ainova
  author: Ainova Systems
  description: Creates or joins a Docker Swarm as an explicitly declared manager or worker, with cluster ports open only to listed peers
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions:
        - resolute
        - noble
  galaxy_tags: [docker, swarm, cluster, firewall]
# Needs a rootful Docker Engine (container_engine, mode rootful) and an active ufw (host_base) first.
# Uses community.docker (docker_swarm) and community.general (ufw), pinned in the collection's requirements.yml.
dependencies: []
