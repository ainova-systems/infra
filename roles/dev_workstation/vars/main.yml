---
# Derived values, not inputs: set dev_workstation_* variables from defaults/main.yml instead.

# Credential scope keys an entry may carry; anything else is rejected.
dev_workstation__scope_keys: [name, url, kind, username, validate_url]

# Credential scopes per account name, with kind and username resolved: kind defaults to github for a
# github.com URL and to generic otherwise; a github scope defaults its username to x-access-token, a
# generic scope has no default (empty, which the assert refuses).
dev_workstation__scopes: >-
  {%- set out = {} -%}
  {%- for account in dev_workstation_accounts if account is mapping -%}
  {%-   set entries = [] -%}
  {%-   for scope in account.credential_scopes | default(dev_workstation_default_credential_scopes) if scope is mapping -%}
  {%-     set host = scope.url | default('') | string | regex_replace('^https://([^/]*).*$', '\\1') | lower -%}
  {%-     set kind = scope.kind | default('github' if host == 'github.com' else 'generic') -%}
  {%-     set _ = entries.append({
            'name': scope.name | default(''),
            'url': scope.url | default(''),
            'kind': kind,
            'username': scope.username | default('x-access-token' if kind == 'github' else '')}) -%}
  {%-   endfor -%}
  {%-   set _ = out.update({account.name | default(''): entries}) -%}
  {%- endfor -%}
  {{ out }}

# Names of the current account's generic scopes: their token files must use TOKEN=, never the legacy GH_TOKEN=.
dev_workstation__generic_scopes: >-
  {{ dev_workstation__scopes[dev_workstation_account.name] | default([])
     | selectattr('kind', 'equalto', 'generic') | map(attribute='name') | list }}
