---
# One rootless daemon for container_engine__account. Included from main.yml in a loop.
- name: Read rootless account entry
  ansible.builtin.command:
    argv: [getent, passwd, "{{ container_engine__account }}"]
  register: container_engine__pw
  changed_when: false
  check_mode: false

- name: Configure rootless daemon
  vars:
    container_engine__uid: "{{ container_engine__pw.stdout.split(':')[2] }}"
    container_engine__home: "{{ container_engine__pw.stdout.split(':')[5] }}"
    container_engine__as: ["{{ container_engine__as_account }}", "{{ container_engine__account }}"]
  block:
    - name: Enable lingering so the daemon runs without a login
      ansible.builtin.command:
        argv: [loginctl, enable-linger, "{{ container_engine__account }}"]
        creates: "/var/lib/systemd/linger/{{ container_engine__account }}"

    - name: Start the account service manager
      ansible.builtin.systemd_service:
        name: "user@{{ container_engine__uid }}.service"
        state: started

    # --force: the installer otherwise refuses while a system daemon runs beside it (rootful mode).
    - name: Install the rootless daemon unit
      ansible.builtin.command:
        argv: "{{ container_engine__as + ['env', '-u', 'DOCKER_HOST', 'dockerd-rootless-setuptool.sh', 'install', '--force'] }}"
        creates: "{{ container_engine__home }}/.config/systemd/user/docker.service"

    - name: Create rootless daemon configuration directory
      ansible.builtin.file:
        path: "{{ container_engine__home }}/.config/docker"
        state: directory
        owner: "{{ container_engine__account }}"
        group: "{{ container_engine__pw.stdout.split(':')[3] }}"
        mode: "0700"

    - name: Configure rootless daemon log rotation
      ansible.builtin.template:
        src: daemon.json.j2
        dest: "{{ container_engine__home }}/.config/docker/daemon.json"
        owner: "{{ container_engine__account }}"
        group: "{{ container_engine__pw.stdout.split(':')[3] }}"
        mode: "0644"
      register: container_engine__user_config

    - name: Read rootless daemon unit state
      ansible.builtin.command:
        argv: "{{ container_engine__as + ['systemctl', '--user', 'is-enabled', 'docker.service'] }}"
      register: container_engine__user_enabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read rootless daemon activity
      ansible.builtin.command:
        argv: "{{ container_engine__as + ['systemctl', '--user', 'is-active', 'docker.service'] }}"
      register: container_engine__user_active
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Enable and start the rootless daemon
      ansible.builtin.command:
        argv: "{{ container_engine__as + ['systemctl', '--user', 'enable', '--now', 'docker.service'] }}"
      changed_when: true
      when: >-
        container_engine__user_enabled.stdout | trim != 'enabled'
        or container_engine__user_active.stdout | trim != 'active'

    # Restarting the daemon stops this account's containers; it happens only when the configuration moved.
    - name: Restart the rootless daemon after a configuration change
      ansible.builtin.command:
        argv: "{{ container_engine__as + ['systemctl', '--user', 'restart', 'docker.service'] }}"
      changed_when: true
      when:
        - container_engine__user_config is changed
        - container_engine__user_active.stdout | trim == 'active'

    - name: Read rootless daemon security options
      ansible.builtin.command:
        argv: "{{ container_engine__as + ['docker', 'info', '--format', 'json'] }}"
      register: container_engine__user_info
      changed_when: false
      check_mode: false
      retries: 10
      delay: 3
      until: container_engine__user_info.rc == 0

    - name: Assert the daemon runs rootless
      ansible.builtin.assert:
        that:
          - "'rootless' in ((container_engine__user_info.stdout | from_json).SecurityOptions | default([]) | join(' '))"
        fail_msg: "The daemon of {{ container_engine__account }} is not rootless."
        quiet: true
