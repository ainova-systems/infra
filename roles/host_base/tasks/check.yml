---
# Read-only. Every probe runs in --check too and never reports a change; one assert at the end
# lists every failed control and fails the host.
- name: Validate inputs and platform
  ansible.builtin.include_tasks: assert.yml

- name: Read the admin accounts
  ansible.builtin.command:
    argv: [getent, passwd, "{{ item.name }}"]
  loop: "{{ host_base__admins }}"
  loop_control:
    label: "{{ item.name }}"
  register: host_base__getent
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the admin accounts' authorized keys
  ansible.builtin.command:
    argv: [cat, "{{ item.stdout.split(':')[5] }}/.ssh/authorized_keys"]
  loop: "{{ host_base__getent.results | selectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: host_base__keys
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the admin sudoers file
  ansible.builtin.command:
    argv: [cat, "{{ host_base__sudoers_file }}"]
  register: host_base__sudoers
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read effective sshd configuration
  ansible.builtin.command:
    argv: [sshd, -T]
  register: host_base__sshd
  changed_when: false
  failed_when: false
  check_mode: false

# Whether sshd comes back after a reboot: one of its units starts at boot, and the service does not require a
# masked socket (systemd then refuses to start it).
- name: Read the SSH units' boot state
  ansible.builtin.command:
    argv: [systemctl, is-enabled, ssh.service, ssh.socket]
  register: host_base__ssh_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the SSH service's requirements
  ansible.builtin.command:
    argv: [systemctl, show, ssh.service, --property=Requires, --value]
  register: host_base__ssh_requires
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read firewall status
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  register: host_base__ufw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read unattended upgrade settings
  ansible.builtin.command:
    argv: [apt-config, dump, APT::Periodic]
  register: host_base__apt_periodic
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read unattended upgrades service state
  ansible.builtin.command:
    argv: [systemctl, is-enabled, unattended-upgrades]
  register: host_base__uu_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read time sync state
  ansible.builtin.command:
    argv: [timedatectl, show, --property=NTP, --property=NTPSynchronized]
  register: host_base__time
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read time daemon state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ host_base__time_daemon }}"]
  register: host_base__time_daemon_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the hostname
  ansible.builtin.command:
    argv: [hostname]
  register: host_base__running_hostname
  changed_when: false
  failed_when: false
  check_mode: false
  when: host_base_hostname | length > 0

- name: Read the static hostname and host table
  ansible.builtin.command:
    argv: [cat, /etc/hostname, /etc/hosts]
  register: host_base__hostname_files
  changed_when: false
  failed_when: false
  check_mode: false
  when: host_base_hostname | length > 0

- name: Read extra package states
  ansible.builtin.command:
    argv: "{{ host_base__dpkg_status_argv + host_base_extra_packages }}"
  register: host_base__extra_packages
  changed_when: false
  failed_when: false
  check_mode: false
  when: host_base_extra_packages | length > 0

- name: Assert host_base controls
  ansible.builtin.assert:
    that:
      - host_base__failures | length == 0
    fail_msg: "host_base FAILED: {{ host_base__failures | join('; ') }}"
    success_msg: >-
      host_base OK: admin {{ host_base__admin_names | join(', ') }}, key-only SSH on {{ host_base_ssh_port }}, firewall
      default deny, updates and time sync
  vars:
    # Per admin account: missing account, missing declared key, undeclared key (exclusive), absent from AllowUsers.
    host_base__admin_failures: >-
      {%- set out = [] -%}
      {%- for admin in host_base__admins -%}
      {%-   set account = host_base__getent.results | selectattr('item.name', 'equalto', admin.name) | first -%}
      {%-   set listing = host_base__keys.results | default([]) | selectattr('item.item.name', 'equalto', admin.name)
                          | map(attribute='stdout') | first | default('') -%}
      {%-   set present = listing.splitlines() | select('match', '^(ssh-|ecdsa-|sk-)[^ ]+ [^ ]') | map('split', ' ')
                          | map(attribute=1) | list -%}
      {%-   set declared = admin['keys'] | map('split', ' ') | map(attribute=1) | list -%}
      {%-   if account.rc != 0 -%}
      {%-     set _ = out.append('admin account ' ~ admin.name ~ ' missing') -%}
      {%-   else -%}
      {%-     if declared | difference(present) | length > 0 -%}
      {%-       set _ = out.append(admin.name ~ ' authorized_keys lacks a declared key') -%}
      {%-     endif -%}
      {%-     if host_base_admin_keys_exclusive | bool and present | difference(declared) | length > 0 -%}
      {%-       set _ = out.append(admin.name ~ ' authorized_keys holds an undeclared key') -%}
      {%-     endif -%}
      {%-   endif -%}
      {%-   if host_base__sshd.stdout is not search('(?m)^allowusers(\s\S+)*\s' ~ (admin.name | regex_escape) ~ '(\s|$)') -%}
      {%-     set _ = out.append('sshd AllowUsers lacks ' ~ admin.name) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
    host_base__missing_rules: >-
      {%- for r in host_base__allow_rules -%}
      {%- set source = 'Anywhere' if r.from == 'any' else r.from -%}
      {%- if host_base__ufw.stdout is not search('(?m)^' ~ (r.port | string) ~ '/' ~ r.proto ~ '\s+ALLOW IN\s+' ~ (source | regex_escape) ~ '(\s|$)') -%}
      {{ r.port }}/{{ r.proto }} from {{ r.from }},
      {%- endif -%}
      {%- endfor -%}
    host_base__installed_extra: >-
      {{ host_base__extra_packages.stdout_lines | default([]) | select('match', '^\S+ installed$')
         | map('split', ' ') | map('first') | list }}
    host_base__missing_extra: "{{ host_base_extra_packages | difference(host_base__installed_extra) }}"
    host_base__ssh_unit_states: "{{ host_base__ssh_enabled.stdout_lines | default([]) | map('trim') | list }}"
    host_base__failures: >-
      {{
        host_base__admin_failures
        + ([] if ((host_base__sudoers.rc == 0 and host_base__sudoers.stdout == host_base__sudoers_content | trim)
                  if host_base_admin_sudo_nopasswd | bool else host_base__sudoers.rc != 0)
           else ['admin sudoers file does not grant exactly the declared admins'])
        + ([] if host_base__sshd.rc == 0 else ['sshd -T failed'])
        + ([] if host_base__sshd.stdout is search('(?m)^permitrootlogin no$') else ['sshd permits root login'])
        + ([] if host_base__sshd.stdout is search('(?m)^passwordauthentication no$') else ['sshd allows password login'])
        + ([] if host_base__sshd.stdout is search('(?m)^kbdinteractiveauthentication no$') else ['sshd allows keyboard-interactive login'])
        + ([] if host_base__sshd.stdout is search('(?m)^pubkeyauthentication yes$') else ['sshd public key login disabled'])
        + ([] if host_base__sshd.stdout is search('(?m)^port ' ~ (host_base_ssh_port | string) ~ '$')
           else ['sshd not on port ' ~ (host_base_ssh_port | string)])
        + ([] if 'enabled' in host_base__ssh_unit_states else ['sshd does not start at boot: neither ssh.service nor ssh.socket is enabled'])
        + ([] if (host_base__ssh_unit_states[1] | default('')) != 'masked'
              or host_base__ssh_requires.stdout is not search('(^|\s)ssh\.socket(\s|$)')
           else ['ssh.service requires the masked ssh.socket: sshd does not start after a reboot'])
        + ([] if host_base__ufw.stdout is search('(?m)^Status: active$') else ['firewall inactive'])
        + ([] if host_base__ufw.stdout is search('Default: deny \(incoming\)') else ['firewall inbound default is not deny'])
        + ([] if (host_base__missing_rules | default('', true)) == ''
           else ['firewall lacks allows: ' ~ host_base__missing_rules | regex_replace(',$', '')])
        + ([] if not host_base_auto_updates | bool or host_base__apt_periodic.stdout is search('Unattended-Upgrade "1"')
           else ['unattended upgrades not scheduled'])
        + ([] if not host_base_auto_updates | bool or host_base__uu_enabled.stdout | trim == 'enabled' else ['unattended-upgrades service not enabled'])
        + ([] if host_base__time_daemon_state.stdout | trim == 'active' else [host_base__time_daemon ~ ' not active'])
        + ([] if host_base__time.stdout is search('(?m)^NTP=yes$') else ['time sync disabled'])
        + ([] if host_base__time.stdout is search('(?m)^NTPSynchronized=yes$') else ['clock not synchronized'])
        + ([] if host_base__sshd.stdout is search('(?m)^allowtcpforwarding ' ~ host_base__tcp_forwarding ~ '$')
           else ['sshd AllowTcpForwarding is not ' ~ host_base__tcp_forwarding])
        + ([] if host_base_hostname | length == 0
              or ((host_base__running_hostname.stdout | default('') | trim) == host_base_hostname
                  and (host_base__hostname_files.stdout_lines | default([]) | first | default('') | trim) == host_base_hostname)
           else ['hostname is not ' ~ host_base_hostname])
        + ([] if host_base_hostname | length == 0
              or host_base__hostname_files.stdout is search('(?m)^' ~ (host_base__hosts_line | regex_escape) ~ '\s*$')
           else ['/etc/hosts lacks: ' ~ host_base__hosts_line])
        + ([] if host_base__missing_extra | length == 0 else ['extra packages not installed: ' ~ host_base__missing_extra | join(', ')])
      }}
