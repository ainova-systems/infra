---
galaxy_info:
  role_name: github_actions_runner
  namespace: ainova
  author: Ainova Systems
  description: Self-hosted GitHub Actions runners as pinned Compose projects on a rootful or rootless daemon, registered once from a run-time token
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions:
        - resolute
        - noble
  galaxy_tags: [ci, runner, docker, compose]
# Needs Docker Engine with the Compose plugin from container_engine first: the system daemon (rootful) or the
# runner account's rootless daemon (rootless).
# Uses community.docker (docker_compose_v2), pinned in the collection's requirements.yml.
dependencies: []
