---
# Read-only check: definitions, volumes, stored registrations and containers match the declared instances.
# Forge-side state (online, labels, job acceptance) is not visible from the host; check it at the forge.

- name: Validate the host and inputs
  ansible.builtin.include_tasks: validate.yml

- name: Read the definition directory
  ansible.builtin.stat:
    path: "{{ github_actions_runner_base_dir }}"
  register: github_actions_runner__base_dir_stat

- name: Assert the definition directory is private
  ansible.builtin.assert:
    that:
      - >-
        not github_actions_runner__base_dir_stat.stat.exists
        or (github_actions_runner__base_dir_stat.stat.isdir and github_actions_runner__base_dir_stat.stat.uid == 0
            and github_actions_runner__base_dir_stat.stat.mode == '0700')
      - >-
        github_actions_runner__base_dir_stat.stat.exists
        or github_actions_runner__active | length == 0
    fail_msg: "{{ github_actions_runner_base_dir }} must exist as a root-owned 0700 directory."
    quiet: true

- name: Check runner instances
  ansible.builtin.include_tasks: check_instance.yml
  loop: "{{ github_actions_runner_instances }}"
  loop_control:
    loop_var: github_actions_runner_instance
    label: "{{ github_actions_runner_instance.name }}"
