---
# Derived values. Not inputs: override agent_workstation_* in defaults instead.

# One entry per enabled tool: source settings plus the resolved url, install dir and executable.
agent_workstation__tools: >-
  {%- set out = [] -%}
  {%- for name in agent_workstation_enabled_tools -%}
  {%- set pin = agent_workstation_tools[name] -%}
  {%- set src = agent_workstation_tool_sources[name] -%}
  {%- set dir = agent_workstation_root ~ '/tools/' ~ name ~ '-' ~ pin.version -%}
  {%- set _ = out.append(src | combine({
        'name': name,
        'version': pin.version,
        'sha256': pin.sha256,
        'check': pin.version_check | default(pin.version),
        'url': src.url | replace('{version}', pin.version) | replace('{commit}', pin.commit | default('')),
        'strip': src.strip | default(0),
        'dir': dir,
        'path': dir ~ '/' ~ src.executable})) -%}
  {%- endfor -%}
  {{ out }}

# One entry per command: the name on PATH, what it resolves to and where it is linked.
agent_workstation__commands: >-
  {%- set out = [] -%}
  {%- for tool in agent_workstation__tools -%}
  {%- for command in tool.commands -%}
  {%- set _ = out.append({
        'command': command,
        'tool': tool.name,
        'check': tool.check,
        'wrap': tool.wrap,
        'link': tool.link,
        'executable': tool.path,
        'target': (agent_workstation_wrapper_dir ~ '/' ~ command) if tool.wrap else tool.path}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}

agent_workstation__playwright_dir: "{{ agent_workstation_root }}/playwright-{{ agent_workstation_playwright_version }}"
agent_workstation__chrome: "{{ agent_workstation_chrome_dir }}/chrome"

# Herdr integration runtime -> the tool that provides its CLI, and the command Herdr runs.
agent_workstation__herdr_runtime_tools:
  claude: claude_code
  codex: codex
  cursor: cursor_agent
  opencode: opencode
agent_workstation__herdr_runtime_commands:
  claude: claude
  codex: codex
  cursor: cursor-agent
  opencode: opencode

# The coding-agent CLIs; in external mode none of them may be enabled here.
agent_workstation__coding_tools: [claude_code, codex, cursor_agent, opencode]

# Account entry keys; anything else is rejected.
agent_workstation__account_keys: [name, credential_scopes, workspace, service_tokens]
agent_workstation__workspace_pattern: '^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$'

# Workspace per account: its own entry, else its dev_workstation entry when that list is defined.
agent_workstation__workspace_of: >-
  {%- set out = {} -%}
  {%- for account in agent_workstation_accounts if account is mapping -%}
  {%-   set dev = (dev_workstation_accounts | default([])) | selectattr('name', 'defined')
                  | selectattr('name', 'equalto', account.name | default('')) | list -%}
  {%-   set _ = out.update({account.name | default(''):
          account.workspace | default((dev | first | default({})).workspace | default(''))}) -%}
  {%- endfor -%}
  {{ out }}
# Herdr start directory of the current account (loop_var agent_workstation__account).
agent_workstation__herdr_workdir: >-
  {{ agent_workstation__workspace_of[agent_workstation__account.name] | default('', true)
     or agent_workstation_herdr_working_directory }}

# Service tokens per account: agent_workstation_service_tokens plus the account's own entries.
agent_workstation__service_tokens_of: >-
  {%- set out = {} -%}
  {%- for account in agent_workstation_accounts if account is mapping -%}
  {%-   set _ = out.update({account.name | default(''): agent_workstation_service_tokens + (account.service_tokens | default([]))}) -%}
  {%- endfor -%}
  {{ out }}
agent_workstation__service_token_keys: [name, env_name]
agent_workstation__secret_env_pattern: '^[A-Z][A-Z0-9_]*$'

# agent-auth verbs; a scope or service token may not use these names.
agent_workstation__reserved_scopes: [check, list, remove, help, credential, service]

# Credential scope keys an entry may carry; anything else is rejected. Same contract as dev_workstation.
agent_workstation__scope_keys: [name, url, kind, username, validate_url]

# Credential scopes per account name, with kind and username resolved exactly as dev_workstation does:
# kind defaults to github for a github.com URL and to generic otherwise; a github scope defaults its
# username to x-access-token, a generic scope has none (empty, which the assert refuses).
agent_workstation__scopes: >-
  {%- set out = {} -%}
  {%- for account in agent_workstation_accounts if account is mapping -%}
  {%-   set entries = [] -%}
  {%-   for scope in account.credential_scopes | default(agent_workstation_default_credential_scopes) if scope is mapping -%}
  {%-     set host = scope.url | default('') | string | regex_replace('^https://([^/]*).*$', '\\1') | lower -%}
  {%-     set kind = scope.kind | default('github' if host == 'github.com' else 'generic') -%}
  {%-     set entry = {
            'name': scope.name | default(''),
            'url': scope.url | default(''),
            'kind': kind,
            'username': scope.username | default('x-access-token' if kind == 'github' else '')} -%}
  {%-     if scope.validate_url is defined -%}{%- set _ = entry.update({'validate_url': scope.validate_url}) -%}{%- endif -%}
  {%-     set _ = entries.append(entry) -%}
  {%-   endfor -%}
  {%-   set _ = out.update({account.name | default(''): entries}) -%}
  {%- endfor -%}
  {{ out }}
