---
# The admin accounts' authorized keys. In check mode an account the run creates does not exist yet, and
# authorized_key cannot resolve its home: the run reports what the apply installs instead of failing the whole
# --check --diff. The apply always runs the key task, so a missing account still fails there before the SSH
# hardening.
- name: Read whether the admin accounts exist
  ansible.builtin.command:
    argv: [id, -u, --, "{{ item.name }}"]
  loop: "{{ host_base__admins }}"
  loop_control:
    label: "{{ item.name }}"
  register: host_base__admin_ids
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report the keys a new admin account receives on the apply
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }} is created on the apply with {{ item.item['keys'] | length }} authorized
      key(s){{ ' (exclusive)' if host_base_admin_keys_exclusive | bool else '' }}.
  loop: "{{ host_base__admin_ids.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: ansible_check_mode and item.rc != 0

- name: Authorize admin public keys
  ansible.posix.authorized_key:
    user: "{{ item.item.name }}"
    key: "{{ item.item['keys'] | join('\n') }}"
    exclusive: "{{ host_base_admin_keys_exclusive | bool }}"
    manage_dir: true
    state: present
  loop: "{{ host_base__admin_ids.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode or item.rc == 0
