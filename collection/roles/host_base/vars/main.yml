---
# Derived values, not inputs: set host_base_* variables from defaults/main.yml instead.
# Every admin account with its keys: the admin first, then host_base_extra_admins.
host_base__admins: >-
  {%- set admins = [{'name': host_base_admin_user, 'keys': host_base_admin_keys}] -%}
  {%- for admin in host_base_extra_admins -%}
  {#- admin['keys'] alone would return the dict's keys() method when the item names no keys. -#}
  {%-   set _ = admins.append({'name': admin.name,
                               'keys': (admin['keys'] if 'keys' in admin else []) or host_base_admin_keys}) -%}
  {%- endfor -%}
  {{ admins }}
host_base__admin_names: "{{ host_base__admins | map(attribute='name') | list }}"
host_base__ssh_users: "{{ host_base__admin_names + host_base_ssh_extra_users }}"
# The sudo grant: one line per admin account.
host_base__sudoers_content: "{{ host_base__admin_names | map('regex_replace', '$', ' ALL=(ALL:ALL) NOPASSWD: ALL') | join('\n') }}\n"
host_base__ssh_rules: >-
  {{ host_base_ssh_allow_from
     | map('community.general.dict_kv', 'from')
     | map('combine', {'port': host_base_ssh_port, 'proto': 'tcp'})
     | list }}
host_base__allow_rules: "{{ host_base__ssh_rules + host_base_firewall_allow }}"
host_base__key_pattern: >-
  ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com)
  [A-Za-z0-9+/]+={0,3}( \S+)?$
host_base__sudoers_file: /etc/sudoers.d/host-base-admin
# AllowTcpForwarding as sshd takes it and as `sshd -T` prints it.
host_base__tcp_forwarding: >-
  {{ 'yes' if host_base_ssh_allow_tcp_forwarding is sameas true
     else ('no' if host_base_ssh_allow_tcp_forwarding is sameas false
     else host_base_ssh_allow_tcp_forwarding | string | lower) }}
# A hostname: lowercase labels of letters, digits and inner hyphens, dot-separated, at most 253 characters.
host_base__hostname_pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$'
# The /etc/hosts line of the hostname: the full name, then the short name when they differ.
host_base__hosts_line: >-
  127.0.1.1 {{ host_base_hostname }}{{ (' ' ~ host_base_hostname.split('.')[0]) if '.' in host_base_hostname else '' }}
# A distribution package name (Debian policy), never a version or release suffix.
host_base__package_pattern: '^[a-z0-9][a-z0-9+.-]+$'
# Package state probe as data, so tests/local-probes.yml runs the exact argv the check runs. Prints
# "<name> <status>" per known name (status "installed" when installed); an unknown name is missing.
host_base__dpkg_status_argv: [dpkg-query, --show, '--showformat=${Package} ${db:Status-Status}\n']
host_base__timesyncd_dropin: /etc/systemd/timesyncd.conf.d/host-base.conf
host_base__chrony_sources: /etc/chrony/sources.d/host-base.sources
# The entry of host_base_releases for the running release; empty when there is none (the assert refuses that).
host_base__release: "{{ host_base_releases[ansible_facts.distribution_version] | default({}) }}"
host_base__time_daemon: "{{ host_base__release.time_daemon | default('') }}"
# Packages providing a time service; every one but host_base__time_daemon must be absent.
host_base__time_daemons: [chrony, systemd-timesyncd, ntp, ntpsec, openntpd]
# A firewall source: "any", an IPv4 address or CIDR, or an IPv6 address or CIDR. Empty never matches.
host_base__source_pattern: '^(any|[0-9]{1,3}([.][0-9]{1,3}){3}(/[0-9]{1,2})?|[0-9A-Fa-f]*:[0-9A-Fa-f:.]*(/[0-9]{1,3})?)$'
