---
# Runs with --check (scripts/validate.sh): ansible_check_mode follows the command line, not a play keyword.
- name: Plan the keys of an admin account the run creates
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    host_base_admin_user: infra-probe-absent-admin
    host_base_admin_keys: [ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyBodyOnly]
    host_base_extra_admins: [{name: infra-probe-absent-second}]
  tasks:
    - name: Run host_base's admin key tasks in check mode for accounts that do not exist
      ansible.builtin.include_role:
        name: ainova.infra.host_base
        tasks_from: admin_keys

    - name: Assert the key task was planned, not attempted
      ansible.builtin.assert:
        that:
          - host_base__admin_ids.results | length == 2
          - host_base__admin_ids.results | map(attribute='rc') | select('equalto', 0) | list | length == 0
        fail_msg: "a probe account exists on the control node; the probe needs absent accounts"
